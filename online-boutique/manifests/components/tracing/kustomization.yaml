apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Note: Grafana Alloy is now installed via Helm (see scripts/install-grafana-alloy.sh)
# This component only configures the application to send traces to Alloy
# Alloy is installed in the 'monitoring' namespace (release: grafana-cloud) and receives traces on port 4317

patches:
# Patch each service individually to avoid matching redis-cart and loadgenerator
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: "grafana-cloud-otel-receiver.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']

- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cartservice
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: "grafana-cloud-otel-receiver.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            # cartservice:v0.8.0 is amd64-only; on an arm64 node it runs under QEMU
            # emulation, where .NET's write-xor-execute JIT protection triggers
            # sporadic System.AccessViolationException crashes in Kestrel's
            # HeartbeatManager. Disabling it is the standard workaround.
            - name: DOTNET_EnableWriteXorExecute
              value: "0"

