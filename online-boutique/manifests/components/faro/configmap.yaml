apiVersion: v1
kind: ConfigMap
metadata:
  name: faro-nginx-conf
data:
  nginx.conf: |
    # The pod runs as a non-root UID (inherited from the frontend Deployment's
    # securityContext), so nginx's default /var/cache/nginx and /var/run
    # paths aren't writable - redirect everything writable to /tmp instead.
    pid /tmp/nginx.pid;

    events {}

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8081;

        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_set_header Host $host;
          # Force plain-text HTML from upstream so sub_filter can rewrite it -
          # it cannot rewrite a gzip-encoded response.
          proxy_set_header Accept-Encoding "";

          sub_filter_types text/html;
          # The page renders its footer twice (a desktop block and a
          # "d-lg-none" mobile-only duplicate, shown/hidden by CSS) - "off"
          # is needed so the footer message lands in both. </head> only
          # appears once regardless, so this doesn't risk double-injecting
          # the Faro script.
          sub_filter_once off;
          # __FARO_COLLECTOR_URL__ / __FARO_APP_NAME__ are substituted by
          # deploy-all-in-one-local.sh from .env before this file is applied -
          # this template has no working default, it's not a real URL.
          sub_filter '</head>' "<script src='https://unpkg.com/@grafana/faro-web-sdk@^1.3.0/dist/bundle/faro-web-sdk.iife.js'></script><script>window.faro=window.GrafanaFaroWebSdk.initializeFaro({url:'__FARO_COLLECTOR_URL__',app:{name:'__FARO_APP_NAME__',version:'1.0.0',environment:'colima-local'},instrumentations:[new window.GrafanaFaroWebSdk.ConsoleInstrumentation(),new window.GrafanaFaroWebSdk.ErrorsInstrumentation(),new window.GrafanaFaroWebSdk.WebVitalsInstrumentation(),new window.GrafanaFaroWebSdk.SessionInstrumentation(),new window.GrafanaFaroWebSdk.ViewInstrumentation()]});</script></head>";

          # Footer branding message, appended right after the "© 2020 Google
          # Inc (Source Code)" line as its own sibling <p>, matching the
          # existing footer-text styling.
          sub_filter '<p class="footer-text">© 2020 Google Inc (<a href="https://github.com/GoogleCloudPlatform/microservices-demo">Source Code</a>)</p>' '<p class="footer-text">© 2020 Google Inc (<a href="https://github.com/GoogleCloudPlatform/microservices-demo">Source Code</a>)</p><p class="footer-text">Monitored with love using Grafana Labs Observability</p>';
        }
      }
    }
